# OCR platform — build lokal ATAU pakai image Docker Hub.
#
# Lokal (build):
#   docker compose up -d --build
#
# Push ke Hub:
#   DOCKERHUB_USER=akunanda bash scripts/docker_push.sh
#
# Server (tanpa source): pakai deploy/docker-compose.yml
#
# OpenSearch (CV search): docker compose -f docker-compose.cv.yml up -d

services:
  ocr:
    image: ${OCR_IMAGE:-checkinpro/ocr:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkinpro-ocr
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OCR_DEVICE: ${OCR_DEVICE:-gpu}
      OCR_FAST_LANG: ${OCR_FAST_LANG:-latin}
      OCR_FAST_DOC_UNWARPING: ${OCR_FAST_DOC_UNWARPING:-1}
      PREPROCESS_AUTO_ROTATE_QUARTERS: ${PREPROCESS_AUTO_ROTATE_QUARTERS:-auto}
      PREPROCESS_PROJECTION_DESKEW: ${PREPROCESS_PROJECTION_DESKEW:-1}
      PREPROCESS_FULL_BLEED_STRAIGHTEN: ${PREPROCESS_FULL_BLEED_STRAIGHTEN:-1}
      PREPROCESS_CARD_WARP: ${PREPROCESS_CARD_WARP:-1}
      PREPROCESS_MIN_SIDE_TARGET: ${PREPROCESS_MIN_SIDE_TARGET:-900}
      DATASET_ROOT: /app/dataset
    volumes:
      - paddle-models:/root/.paddlex
      - ocr-logs:/app/logs
      # Dataset benchmark (/dataset-test) — folder host, tidak ikut image Hub
      - ./dataset:/app/dataset:ro
    restart: unless-stopped

volumes:
  paddle-models:
  ocr-logs:
