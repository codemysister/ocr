<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Fallback AI — OCR Platform</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --border: #2d3a4d;
      --text: #e8eef5;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --ok: #6ee7b7;
      --err: #f87171;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.25rem clamp(1rem, 4vw, 2rem);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #151c26 0%, var(--bg) 100%);
    }
    header h1 { margin: 0; font-size: clamp(1.15rem, 2.5vw, 1.4rem); }
    header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.85rem; }
    .nav-top { margin-top: 0.6rem; }
    .nav-top a { color: var(--accent); font-size: 0.875rem; margin-right: 1rem; }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem clamp(1rem, 3vw, 1.5rem) 2rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    button, .filter-btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #061018; border-color: transparent; }
    button.danger { color: var(--err); border-color: rgba(248,113,113,0.4); }
    button:hover, .filter-btn:hover { border-color: var(--accent); }
    .filter-btn.active { border-color: var(--accent); background: rgba(61,156,245,0.12); color: var(--accent); }
    .stats {
      display: grid;
      gap: 0.65rem;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      margin-bottom: 1rem;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
    }
    .stat .val { font-size: 1.35rem; font-weight: 700; }
    .stat .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
    .stat.ok .val { color: var(--ok); }
    .stat.err .val { color: var(--err); }
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    .cards { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-head {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: flex-start;
      justify-content: space-between;
    }
    .card-head .left { flex: 1; min-width: 200px; }
    .fname { font-family: ui-monospace, monospace; font-size: 0.82rem; word-break: break-all; margin: 0.25rem 0; }
    .meta { font-size: 0.75rem; color: var(--muted); }
    .tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tag.rescued { background: rgba(110,231,183,0.15); color: var(--ok); }
    .tag.failed { background: rgba(248,113,113,0.15); color: var(--err); }
    .tag.source { background: rgba(61,156,245,0.12); color: var(--accent); }
    .card-body { padding: 0.9rem 1rem; display: grid; gap: 0.85rem; }
    .section label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .section p { margin: 0; font-size: 0.85rem; color: var(--text); }
    .grid2 {
      display: grid;
      gap: 0.65rem 1rem;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      font-size: 0.82rem;
    }
    .grid2 dt { color: var(--muted); font-size: 0.68rem; text-transform: uppercase; margin: 0; }
    .grid2 dd { margin: 0.1rem 0 0; }
    pre {
      margin: 0;
      padding: 0.65rem 0.75rem;
      background: #0a0e14;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow: auto;
    }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status.err { color: var(--err); }
    .check-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--muted); }
    .check-row input { accent-color: var(--accent); }
    code { font-size: 0.75rem; background: #0a0e14; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>Log fallback AI</h1>
    <p>Setiap validasi Paddle gagal lalu memicu AI vision dicatat di sini (file JSONL di server).</p>
    <div class="nav-top">
      <a href="/">← Beranda</a>
      <a href="/pipeline">Pipeline</a>
      <a href="/dataset-test">Dataset benchmark</a>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <button type="button" class="filter-btn active" data-filter="all">Semua</button>
      <button type="button" class="filter-btn" data-filter="rescued">Rescue OK</button>
      <button type="button" class="filter-btn" data-filter="failed">Tetap gagal</button>
      <button type="button" class="primary" id="btnRefresh">Muat ulang</button>
      <button type="button" id="btnMore">Lebih banyak</button>
      <button type="button" class="danger" id="btnClear">Hapus log</button>
      <label class="check-row"><input type="checkbox" id="autoRefresh" /> Auto 15s</label>
      <span class="status" id="status">Memuat…</span>
    </div>

    <div id="content" class="cards"></div>
  </div>

  <script>
    const statsEl = document.getElementById("stats");
    const contentEl = document.getElementById("content");
    const statusEl = document.getElementById("status");
    const btnRefresh = document.getElementById("btnRefresh");
    const btnMore = document.getElementById("btnMore");
    const btnClear = document.getElementById("btnClear");
    const autoRefreshEl = document.getElementById("autoRefresh");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let filter = "all";
    let limit = 30;
    let autoTimer = null;

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtTime(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString("id-ID");
      } catch {
        return iso;
      }
    }

    function queryParams() {
      const p = new URLSearchParams({ limit: String(limit), offset: "0" });
      if (filter === "rescued") p.set("rescued_only", "true");
      if (filter === "failed") p.set("failed_only", "true");
      return p.toString();
    }

    function renderStats(stats) {
      statsEl.innerHTML = [
        { lbl: "Total log", val: stats?.total ?? 0, cls: "" },
        { lbl: "Rescue (recent)", val: stats?.rescued_recent ?? 0, cls: "ok" },
        { lbl: "Gagal (recent)", val: stats?.failed_recent ?? 0, cls: "err" },
      ].map((c) =>
        `<div class="stat ${c.cls}"><div class="val">${esc(c.val)}</div><div class="lbl">${esc(c.lbl)}</div></div>`
      ).join("");
    }

    function renderCard(e) {
      const rescued = !!e.rescued;
      const tagCls = rescued ? "rescued" : "failed";
      const tagText = rescued ? "Rescue OK" : "Tetap gagal";
      const llm = e.llm_validation || {};
      const ann = e.llm_annotation || {};
      const fb = e.llm_fallback || {};
      return `<article class="card">
        <div class="card-head">
          <div class="left">
            <span class="tag ${tagCls}">${tagText}</span>
            <span class="tag source">${esc(e.source || "pipeline")}</span>
            <div class="fname">${esc(e.filename || "—")}</div>
            <div class="meta">${esc(e.document_profile_id || e.document_type || "—")} · ${fmtTime(e.logged_at)}</div>
          </div>
          <div class="meta">${typeof fb.latency_s === "number" ? fb.latency_s.toFixed(1) + "s AI" : ""}</div>
        </div>
        <div class="card-body">
          <div class="section">
            <label>Gagal Paddle</label>
            <p>${esc(e.paddle_failure_summary || "—")}</p>
          </div>
          ${e.expected_name ? `<div class="section"><label>Referensi</label><p>${esc(e.expected_name)}${e.expected_nik ? " · NIK " + esc(e.expected_nik) : ""}</p></div>` : ""}
          <dl class="grid2">
            <div><dt>AI jenis dokumen</dt><dd>${llm.document_type_matches_expected ? "✓ cocok" : "✗ tidak"}</dd></div>
            <div><dt>AI identitas</dt><dd>${llm.identity_matches_reference ? "✓ cocok" : "✗ tidak"}</dd></div>
            <div><dt>Confidence</dt><dd>${typeof llm.confidence === "number" ? llm.confidence + "%" : "—"}</dd></div>
            <div><dt>Hasil akhir</dt><dd>${e.final_matched ? "Lolos" : "Gagal"}</dd></div>
            <div><dt>Nama (AI)</dt><dd>${esc(ann.holder_name || llm.holder_name || "—")}</dd></div>
            <div><dt>NIK (AI)</dt><dd>${esc(ann.identity_number || llm.identity_number || "—")}</dd></div>
          </dl>
          ${llm.notes ? `<div class="section"><label>Catatan AI</label><p>${esc(llm.notes)}</p></div>` : ""}
          ${fb.error ? `<div class="section"><label>Error AI</label><p style="color:var(--err)">${esc(fb.error)}</p></div>` : ""}
          ${e.ocr_text_preview ? `<div class="section"><label>Cuplikan OCR Paddle</label><pre>${esc(e.ocr_text_preview)}</pre></div>` : ""}
        </div>
      </article>`;
    }

    async function loadLogs() {
      statusEl.textContent = "Memuat…";
      statusEl.className = "status";
      try {
        const res = await fetch("/api/v1/llm-fallback-logs?" + queryParams());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        renderStats(data.stats);
        const entries = data.entries || [];
        if (!entries.length) {
          contentEl.innerHTML = '<div class="empty">Belum ada log fallback AI.<br>Jalankan pipeline / dataset test pada dokumen yang gagal validasi Paddle.</div>';
        } else {
          contentEl.innerHTML = entries.map(renderCard).join("");
        }
        statusEl.textContent = `Menampilkan ${entries.length} dari ${data.total ?? 0} entri · ${data.stats?.log_path || ""}`;
      } catch (e) {
        statusEl.textContent = "Gagal memuat: " + e.message;
        statusEl.className = "status err";
      }
    }

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        filter = btn.dataset.filter || "all";
        limit = 30;
        loadLogs();
      });
    });

    btnRefresh.addEventListener("click", () => { limit = 30; loadLogs(); });
    btnMore.addEventListener("click", () => { limit += 30; loadLogs(); });

    btnClear.addEventListener("click", async () => {
      if (!confirm("Hapus semua log fallback AI?")) return;
      try {
        const res = await fetch("/api/v1/llm-fallback-logs", { method: "DELETE" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        statusEl.textContent = `Dihapus ${data.cleared ?? 0} entri.`;
        loadLogs();
      } catch (e) {
        alert("Gagal hapus: " + e.message);
      }
    });

    autoRefreshEl.addEventListener("change", () => {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = null;
      if (autoRefreshEl.checked) {
        autoTimer = setInterval(loadLogs, 15000);
      }
    });

    loadLogs();
  </script>
</body>
</html>
