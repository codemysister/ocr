# Jalankan di server: cukup file ini + (opsional) .env
# Tidak perlu clone repo atau Python.
#
#   export OCR_IMAGE=akunanda/ocr:latest
#   docker compose -f docker-compose.yml pull
#   docker compose -f docker-compose.yml up -d
#
# Atau one-liner:
#   docker run -d --name checkinpro-ocr -p 8001:8001 --restart unless-stopped akunanda/ocr:latest

services:
  ocr:
    image: ${OCR_IMAGE:-checkinpro/ocr:latest}
    pull_policy: always
    container_name: checkinpro-ocr
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OCR_DEVICE: ${OCR_DEVICE:-gpu}
      OCR_FAST_LANG: ${OCR_FAST_LANG:-latin}
    volumes:
      - paddle-models:/root/.paddlex
      - ocr-logs:/app/logs
    restart: unless-stopped

volumes:
  paddle-models:
  ocr-logs:
