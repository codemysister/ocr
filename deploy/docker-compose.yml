# Di server (setelah git clone + scripts/server_build.sh):
#
#   bash scripts/server_build.sh
#   docker compose -f deploy/docker-compose.yml up -d
#
# Update kode: git pull && bash scripts/server_build.sh && docker compose -f deploy/docker-compose.yml up -d

services:
  ocr:
    image: ${OCR_IMAGE:-ocr:gpu}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile.gpu
      args:
        BASE_IMAGE: ${OCR_BASE_IMAGE:-ocr:gpu-base}
    container_name: checkinpro-ocr
    gpus: all
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      OCR_DEVICE: ${OCR_DEVICE:-gpu}
      OCR_FAST_LANG: ${OCR_FAST_LANG:-latin}
      DATASET_ROOT: /app/dataset
    volumes:
      - paddle-models:/root/.paddlex
      - ocr-logs:/app/logs
    restart: unless-stopped

volumes:
  paddle-models:
  ocr-logs:
